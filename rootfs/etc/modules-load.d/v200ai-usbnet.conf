# Type-A 上的 USB 网卡（Realtek RTL8156，0bda:8156）走 CDC-NCM，不加载 r8152。
#
# 该卡有 3 个 configuration：1=vendor(r8152)、2=CDC-NCM、3=CDC-ECM。
# usbcore 会跳过首接口是 vendor 类的 config，选 config 2；r8152 的 cfgselector
# 则会切到 vendor config，随后读 PLA 0xe820 报 -71，设备掉线。
#
# 依赖顺序：usbnet(带 mii) → cdc_ether(导出 usbnet_cdc_update_filter) → cdc_ncm。
usbnet
cdc_ether
cdc_ncm
