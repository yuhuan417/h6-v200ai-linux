# ECDH 自检需要随机数生成器。
#
# 背景：Debian 内核 6.1.190 的 ecdh-nist-p256 自检会生成一个随机测试私钥，
# 这需要 crypto API 里有 RNG 算法。而本板模块树被裁剪过，
# jitterentropy_rng.ko / drbg.ko 都被删了，导致：
#   alg: ecdh-nist-p256: test failed on vector 2, err=-14
#   Bluetooth: hci0: Unable to create ECDH crypto context
# p192/p384 不需要随机私钥，所以它们一直能过。
#
# 补装这两个模块后 p256 自检通过，BLE LESC 配对恢复正常。
# 必须比 bluetooth 早加载，所以放 modules-load.d。
jitterentropy_rng
drbg
